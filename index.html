<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>24hr Stories</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Stories</h1>
  <p class="sub">Photos you add disappear after 24 hours.</p>
  <div id="strip" role="list"></div>
  <div id="empty" class="empty" hidden>No stories yet. Tap + to add a photo.</div>
</main>

<input id="file" type="file" accept="image/*" hidden>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Story viewer">
  <div id="stage">
    <div id="bars"></div>
    <div id="meta">
      <span id="age"></span>
      <span>
        <button class="vbtn" id="del">Delete</button>
        <button class="vbtn" id="close" aria-label="Close">Close</button>
      </span>
    </div>
    <img id="pic" alt="Story">
  </div>
</div>

<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
